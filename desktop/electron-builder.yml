appId: com.dopomine.desktop
productName: Dopamine
copyright: Created by dopamine
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/catalog.db
    to: catalog/catalog.db
asar: true
# installers are built by CI and attached to a GitHub release; no auto-update feed
publish: null
afterPack: scripts/after-pack.cjs
protocols:
  - name: Dopamine
    # dopomine:// is the old name: links made before the rename still open the app
    schemes: [dopamine, dopomine]
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  # editing the exe needs Wine off Windows; scripts/after-pack.cjs sets the icon and version instead
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Dopamine
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: Dopamine-Setup-${version}.${ext}
portable:
  artifactName: Dopamine-${version}-portable.${ext}
linux:
  target: [AppImage, deb]
  syncDesktopName: true
  category: AudioVideo
  icon: build/icon.png
  maintainer: dopamine
  artifactName: Dopamine-${version}.${ext}
mac:
  target: dmg
  category: public.app-category.entertainment
  icon: build/icon.png
  artifactName: Dopamine-${version}.${ext}
