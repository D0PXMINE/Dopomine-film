name: Desktop

# Builds the desktop app on each OS and attaches the installers to the "desktop" release
# (a release, not build artifacts: those have a storage quota).
on:
  push:
    paths:
      - "desktop/**"
      - "app/src/main/assets/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      mac:
        description: "Собрать и для macOS (если GitHub выделит машину с macOS)"
        type: boolean
        default: false

permissions:
  contents: write

# a newer push supersedes the builds still running for the branch
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are not always granted (the job then waits in the queue and is cancelled),
        # so macOS is built only on request
        os: ${{ fromJSON(inputs.mac && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Package
        run: npx electron-builder ${{ runner.os == 'Windows' && '--win nsis portable' || runner.os == 'Linux' && '--linux AppImage deb' || '--mac dmg' }} --publish never
        env:
          # no signing certificate: build unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Attach to the "desktop" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.AppImage release/*.deb release/*.dmg)
          [ ${#files[@]} -gt 0 ] || { echo "nothing to upload"; exit 1; }
          gh release view desktop >/dev/null 2>&1 || \
            gh release create desktop --title "dopamine для компьютера" --latest=false \
              --notes "Установщики для Windows, Linux и macOS. Обновляются при каждой сборке." || true
          gh release edit desktop --title "dopamine для компьютера" || true
          gh release upload desktop "${files[@]}" --clobber
          # older versions (and the old name) of the installers this system builds go away;
          # the other systems' files are theirs to replace
          keep=" "
          for f in "${files[@]}"; do keep+="$(basename "$f") "; done
          exts=" "
          for f in "${files[@]}"; do exts+="${f##*.} "; done
          gh release view desktop --json assets --jq '.assets[].name' | while read -r name; do
            [[ "$exts" == *" ${name##*.} "* ]] || continue
            [[ "$keep" == *" $name "* ]] || gh release delete-asset desktop "$name" --yes || true
          done
