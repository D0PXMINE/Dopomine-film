name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        env:
          # optional repository secret: bakes your Kinopoisk Unofficial API key into the APK
          KP_API_KEY: ${{ secrets.KP_API_KEY }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Dopomine-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
