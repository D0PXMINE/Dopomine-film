name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # The owner's signing key comes from the SIGNING_KEYSTORE (base64) and SIGNING_PASSWORD secrets.
      # It is checked first: a secret pasted with extra characters or cut short must not fail the build.
      - name: Signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ]; then
            echo "::warning::No SIGNING_KEYSTORE secret: the APK is signed with a throwaway debug key and will not install over the official one"
            exit 0
          fi
          key="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEYSTORE" | tr -d ' \r\n\t' | base64 -d > "$key" 2>/dev/null || true
          password=$(printf '%s' "$SIGNING_PASSWORD" | tr -d '\r\n')
          echo "::add-mask::$password"
          if keytool -list -keystore "$key" -storepass "$password" > /dev/null 2>&1; then
            echo "DOPOMINE_KEYSTORE=$key" >> "$GITHUB_ENV"
            echo "DOPOMINE_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "Signing with the owner's key"
          else
            echo "::warning::SIGNING_KEYSTORE and SIGNING_PASSWORD do not open the key (key file from the secret: $(stat -c %s "$key") bytes, password: ${#password} characters). The APK is signed with a throwaway debug key."
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      # the APK also lives in release/; a full artifact quota should not turn the build red
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Dopamine-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
