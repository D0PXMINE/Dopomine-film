name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # the owner's signing key comes from the SIGNING_KEYSTORE (base64) and SIGNING_PASSWORD secrets
      - name: Signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DOPOMINE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEYSTORE secret: the APK is signed with a throwaway debug key and will not install over the official one"
          fi

      - name: Build release APK
        env:
          DOPOMINE_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      # the APK also lives in release/; a full artifact quota should not turn the build red
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Dopomine-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
